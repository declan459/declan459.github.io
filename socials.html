<!doctype html>
<html>
  <head>
    <style>
      html {
        background-color: #121212;
      }
      .content {
        position: absolute;
        left: 50%;
        top: 50%;
        -webkit-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
      }

      .logo:hover {
        transform: scale(1.2);
      }

      img {
        padding: 5px;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <a href="https://mastodon.nz/@declan"
        ><img
          class="logo"
          width="44"
          height="44"
          src="images/mastodon.png" /></a
      ><a href="https://tiktok.com/@stroopienz"
        ><img class="logo" width="44" height="44" src="images/tiktok.png" /></a
      ><a href="https://www.youtube.com/@stroopienz"
        ><img class="logo" width="44" height="44" src="images/youtube.png"
      /></a>
    </div>
  </body>
</html>
